name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une seule exécution par branche : un push qui en suit un autre annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # corepack lit le champ `packageManager` du package.json racine : la version de
      # pnpm est donc celle du dépôt, jamais celle du runner.
      #
      # `node-version` est la version qui exécute NOTRE code ; elle n'a rien à voir avec
      # le runtime que l'action utilise pour elle-même. C'est ce dernier que la
      # dépréciation de Node 20 visait, d'où les majeurs relevés ci-dessus.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # `@pkfind/shared` expose ses types via `dist/index.d.ts` : sur un checkout neuf ce
      # dossier n'existe pas, et typecheck comme test échouent sur des modules introuvables.
      # Un poste de développement ne le voit jamais, son `dist` traînant d'une exécution
      # précédente. Les tests de bout en bout reconstruisent de toute façon.
      - run: pnpm build

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Les tests de bout en bout construisent tout et lancent le vrai serveur Node sur
      # le port 3000 — la topologie de production. Ce sont les seuls qui couvrent le
      # parcours multijoueur, d'où leur présence ici malgré leur coût.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
